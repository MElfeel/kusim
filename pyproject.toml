[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kusim"
version = "0.1.0"
description = "KUSIM: a 3-D two-phase (oil/water) IMPES reservoir simulator for teaching"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
kusim = "kusim.cli:main"

[project.optional-dependencies]
viz = ["plotly>=5"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]          # kusim serve: the commands over HTTP (kusim.api)
plot = ["plotly>=5", "kaleido>=1"]                      # kusim plot: figures (kaleido, with a Chrome or Chromium browser, writes images; .html and .json need no browser)
excel = ["openpyxl>=3.1"]                          # kusim import-history: historical data from Excel workbooks (kusim.excel)
dev = ["pytest>=7", "plotly>=5", "kaleido", "jsonschema>=4", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.25", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kusim = ["plot_examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that run an ensemble filter or an optimisation (several seconds each)"]
